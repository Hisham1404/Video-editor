[project]
name = "reel-editor"
version = "0.1.0"
description = "Reference-driven reel editor: extract a reel's editing grammar and reapply it"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
